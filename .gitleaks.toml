[extend]
useDefault = true

[[allowlists]]
description = "Published Sparkle verification keys"
paths = [
  '''^apps/macos/config/\.env\.release\.(staging|production)$''',
]

[[allowlists]]
description = "Deterministic protocol fixture data"
paths = [
  '''^docs/remote/fixtures/v1\.json$''',
]
regexTarget = "secret"
regexes = [
  '''^fixture-idempotency-0001$''',
]
