[workspace]
members = [
  "crates/ditch_cli",
  "crates/ditch_commercial",
  "crates/ditch_protocol",
  "crates/ditch_remote",
  "crates/ditch_store",
  "crates/ditchd",
]
exclude = ["community"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "LicenseRef-Ditch-Commercial"
version = "0.1.0"

[workspace.dependencies]
ditch_core = { path = "community/crates/ditch_core" }
ditch_identity = { path = "community/crates/ditch_identity" }
ditch_product = { path = "community/crates/ditch_product" }
ditch_commercial = { path = "crates/ditch_commercial" }
ditch_protocol = { package = "ditch_commercial_protocol", path = "crates/ditch_protocol" }
ditch_remote = { package = "ditch_commercial_remote", path = "crates/ditch_remote" }
ditch_commercial_store = { path = "crates/ditch_store" }
ditch_ssh = { path = "community/crates/ditch_ssh" }
ditch_store = { path = "community/crates/ditch_store" }
ditch_upgrade = { path = "community/crates/ditch_upgrade" }

chrono = { version = "0.4.42", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
uuid = { version = "1.19.0", features = ["serde", "v4"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
libc = "0.2.189"
aes-gcm = "0.10.3"
base64 = "0.22.1"
hkdf = "0.12.4"
p256 = { version = "0.13.2", features = ["ecdh", "ecdsa", "pkcs8"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
sha2 = "0.10.9"
semver = "1.0.28"
url = "2.5.7"
