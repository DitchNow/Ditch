name: Bug report
description: Report a reproducible problem in Ditch Community Edition.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Remove credentials, authentication tokens, private source code, and other sensitive information before submitting. Inspect and redact logs because they may contain repository paths, prompts, commands, or source text.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: A concise description of the problem.
    validations:
      required: true

  - type: input
    id: ditch-version
    attributes:
      label: Ditch version or commit
      description: Provide the app version or Git commit if known.
      placeholder: 1.0.0, commit SHA, or unknown
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: macOS 15.6
    validations:
      required: true

  - type: input
    id: codex-version
    attributes:
      label: Codex version
      description: Include the output of `codex --version` when Codex is involved.
      placeholder: codex-cli 0.x.x, or not applicable

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that reliably demonstrates the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Reproduction frequency
      options:
        - Every time
        - Sometimes
        - Once
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste only the relevant, redacted portion. Do not include secrets, private prompts, or source code.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or other details if they help explain the problem.

  - type: checkboxes
    id: sensitive-data
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed credentials, authentication tokens, private source code, and other sensitive information.
          required: true
